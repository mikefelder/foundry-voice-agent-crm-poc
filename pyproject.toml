[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crm-companion"
version = "0.1.0"
description = "Hands-free voice sales assistant on Microsoft Foundry Agent Service and Voice Live"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
azure = [
    "azure-identity>=1.25",
    "azure-ai-projects>=2.5",
    # aiohttp is not optional in practice: the async client refuses to import without it.
    "azure-ai-voicelive[aiohttp]>=1.3",
]
voice = [
    "pyaudio>=0.2.14",
]
dev = [
    "crm-companion[api]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "openapi-spec-validator>=0.7",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crm_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Live tests are opt-in: they need credentials, spend API quota, and mutate the
# org. Run them with `pytest -m liveorg`.
addopts = "-q --strict-markers -m 'not liveorg'"
asyncio_mode = "auto"
markers = ["liveorg: hits the real Salesforce org; deselected by default"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
