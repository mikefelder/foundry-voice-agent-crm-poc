[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crm-companion"
version = "0.1.0"
description = "Hands-free voice sales assistant on Microsoft Foundry Agent Service and Voice Live"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
azure = [
    "azure-identity>=1.19",
    "azure-ai-projects>=2.0.0b3",
    "azure-ai-voicelive>=1.2.0b4",
]
voice = [
    "pyaudio>=0.2.14",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "openapi-spec-validator>=0.7",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crm_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
