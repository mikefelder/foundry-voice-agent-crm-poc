# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: crm-companion-tools
metadata:
  template: crm-companion-tools@1.0.0

services:
  tools:
    project: .
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      # Built by ACR Tasks so a local Docker daemon is not a prerequisite.
      remoteBuild: true
