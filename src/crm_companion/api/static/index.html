<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRM Sales Companion</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <h1>CRM Sales Companion</h1>
    <p>Enter the tool API key to start a session.</p>
    <input id="key" type="password" placeholder="API key" autocomplete="off" required />
    <button type="submit">Connect</button>
    <p id="gate-error" class="gate-error" hidden></p>
  </form>
</div>

<main id="app" hidden>
  <header>
    <div>
      <h1>CRM Sales Companion</h1>
      <p id="status" class="status">connecting…</p>
    </div>
    <button id="mic" class="mic" type="button" aria-pressed="false" title="Toggle microphone">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 12a7 7 0 0 1-14 0M12 19v3"/>
      </svg>
      <span id="mic-label">Talk</span>
    </button>
  </header>

  <section id="transcript" class="transcript" aria-live="polite"></section>

  <form id="composer" class="composer">
    <input id="message" type="text" placeholder="Type a message, or press Talk…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
